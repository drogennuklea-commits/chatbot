<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Doradca wędkarski</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎣%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root {
  --air: #EEF3F1;
  --water: #D3E3DF;
  --paper: #F8FBFA;
  --deep: #12383A;
  --ink: #14262A;
  --muted: #4C6468;
  --line: #9DB8B2;
  --bobber: #D6362A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --air: #10282A;
    --water: #0A1B1C;
    --paper: #14302F;
    --deep: #2A6B67;
    --ink: #E4EFED;
    --muted: #9DB5B1;
    --line: #35625E;
    --bobber: #F0503F;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--water); color: var(--ink);
  font: 400 1.0625rem/1.55 "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:focus-visible { outline: 3px solid var(--bobber); outline-offset: 2px; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 1.25rem; }

/* Powietrze: nagłówek */
.air { background: var(--air); padding-top: 1.25rem; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
h1 {
  font: 800 clamp(1.7rem, 5.5vw, 2.4rem)/1.05 "Bricolage Grotesque", system-ui, sans-serif;
  letter-spacing: -0.02em; margin: 0 0 .4rem;
}
.sub { margin: 0; color: var(--muted); max-width: 34ch; }
.ghost {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: .45rem .85rem; border-radius: 999px; font: inherit; font-size: .9rem;
  cursor: pointer; white-space: nowrap;
}
.ghost:hover { background: var(--paper); }

/* Linia wody ze spławikiem */
.scene { position: relative; height: 56px; background: var(--air); }
.scene .wrap { position: relative; height: 100%; }
.bobber { position: absolute; right: 2.4rem; bottom: 2px; width: 24px; height: 64px; }
.wave { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34px; display: block; }
.busy .bobber { animation: bite 1.8s ease-in-out infinite; }
@keyframes bite {
  0%, 100% { transform: translateY(0); }
  25% { transform: translateY(14px); }
  40% { transform: translateY(5px); }
  60% { transform: translateY(16px); }
}

/* Woda: rozmowa */
main { flex: 1; overflow-y: auto; scroll-behavior: smooth; background: var(--water); }
#log { padding-block: 1.25rem .5rem; display: flex; flex-direction: column; gap: 1.1rem; }
.msg { max-width: 88%; overflow-wrap: anywhere; }
.msg.user {
  align-self: flex-end; background: var(--deep); color: #F4FAF9;
  padding: .6rem .95rem; border-radius: 1.1rem 1.1rem .3rem 1.1rem;
}
.msg.bot { align-self: flex-start; border-left: 2px solid var(--line); padding-left: .9rem; }
.msg.err { border-left-color: var(--bobber); }
.msg.wait { color: var(--muted); font-style: italic; }
.msg p { margin: 0 0 .6rem; }
.msg p:last-child { margin: 0; }
.msg ul, .msg ol { margin: .2rem 0 .6rem; padding-left: 1.3rem; }
.msg code { background: var(--paper); padding: .05em .3em; border-radius: 4px; }

.empty h2 { font: 700 1.4rem/1.2 "Bricolage Grotesque", system-ui, sans-serif; margin: .5rem 0 .3rem; }
.empty p { margin: 0 0 1rem; color: var(--muted); max-width: 40ch; }
.empty[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: .5rem .85rem; border-radius: 999px; font: inherit; font-size: .95rem;
  cursor: pointer; text-align: left;
}
.chip:hover { background: var(--deep); border-color: var(--deep); color: #F4FAF9; }

/* Pole pisania */
.dock { background: var(--water); border-top: 1px solid var(--line); padding: .7rem 0 .8rem; }
form { display: flex; gap: .5rem; }
input[type="text"] {
  flex: 1; min-width: 0; font: inherit; padding: .75rem 1.1rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
input::placeholder { color: var(--muted); }
.send {
  width: 48px; height: 48px; flex: none; border: 0; border-radius: 50%;
  background: var(--deep); color: #F4FAF9; cursor: pointer; display: grid; place-items: center;
}
.send:disabled { opacity: .5; cursor: default; }
.note { margin: .55rem .3rem 0; font-size: .82rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .busy .bobber { animation: none; }
  main { scroll-behavior: auto; }
}
</style>
</head>
<body>
<header class="air">
  <div class="wrap head">
    <div>
      <h1>Doradca wędkarski</h1>
      <p class="sub">Sprzęt, przynęty, techniki i ryby. Pytaj o wszystko, co dotyczy wędkowania.</p>
    </div>
    <button class="ghost" id="reset" type="button">Nowa rozmowa</button>
  </div>
</header>

<div class="scene" aria-hidden="true">
  <div class="wrap">
    <svg class="bobber" viewBox="0 0 24 64">
      <rect x="11" y="0" width="2" height="16" rx="1" fill="#14262A"/>
      <ellipse cx="12" cy="30" rx="9" ry="14" fill="#FFFFFF"/>
      <path d="M3 30a9 14 0 0 1 18 0z" fill="#D6362A"/>
      <rect x="11.3" y="44" width="1.4" height="20" fill="#14262A"/>
    </svg>
  </div>
  <svg class="wave" viewBox="0 0 1200 34" preserveAspectRatio="none">
    <path d="M0 6 Q50 0 100 6 T200 6 T300 6 T400 6 T500 6 T600 6 T700 6 T800 6 T900 6 T1000 6 T1100 6 T1200 6 V34 H0 Z" fill="var(--water)"/>
  </svg>
</div>

<main id="area">
  <div class="wrap" id="log" aria-live="polite">
    <section class="empty" id="empty">
      <h2>Zapytaj o wędkarstwo</h2>
      <p>Napisz własne pytanie albo zacznij od jednego z tych.</p>
      <div class="chips">
        <button class="chip" type="button">Jaka przynęta na szczupaka jesienią?</button>
        <button class="chip" type="button">Jak zacząć łowić karpie?</button>
        <button class="chip" type="button">Jak dobrać wędkę spinningową?</button>
        <button class="chip" type="button">Spławik czy gruntówka, co wybrać?</button>
      </div>
    </section>
  </div>
</main>

<footer class="dock">
  <div class="wrap">
    <form id="form" autocomplete="off">
      <input type="text" id="msg" placeholder="Napisz pytanie o wędkarstwo…" aria-label="Twoje pytanie" maxlength="1000">
      <button class="send" id="send" type="submit" aria-label="Wyślij">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      </button>
    </form>
    <p class="note">Bot może się mylić. Wymiary i okresy ochronne sprawdzaj w regulaminie łowiska.</p>
  </div>
</footer>

<script>
const historia = [];
const area = document.getElementById("area");
const log = document.getElementById("log");
const empty = document.getElementById("empty");
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("send");
let busy = false;

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
// Prosty, bezpieczny formatter: akapity, listy, pogrubienia
function md(text) {
  return text.trim().split(/\n{2,}/).map(function (b) {
    const lines = b.split("\n");
    if (lines.every(l => /^\s*[-*•]\s+/.test(l)))
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>").join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l)))
      return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    return "<p>" + lines.map(l => inline(l.replace(/^#{1,6}\s+/, ""))).join("<br>") + "</p>";
  }).join("");
}

function add(cls, content, asHtml) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (asHtml) d.innerHTML = content; else d.textContent = content;
  log.appendChild(d);
  area.scrollTop = area.scrollHeight;
  return d;
}

function setBusy(v) {
  busy = v;
  document.body.classList.toggle("busy", v);
  msg.disabled = v;
  sendBtn.disabled = v;
  if (!v) msg.focus();
}

async function ask(tekst) {
  tekst = tekst.trim();
  if (!tekst || busy) return;
  empty.hidden = true;
  add("user", tekst);
  historia.push({ role: "user", content: tekst });
  const wait = add("bot wait", "Piszę odpowiedź…");
  setBusy(true);
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: historia }),
    });
    const data = await r.json();
    wait.remove();
    if (!r.ok || !data.reply) {
      historia.pop();
      add("bot err", "Nie udało się uzyskać odpowiedzi. Spróbuj ponownie za chwilę.");
    } else {
      historia.push({ role: "assistant", content: data.reply });
      add("bot", md(data.reply), true);
    }
  } catch (e) {
    wait.remove();
    historia.pop();
    add("bot err", "Brak połączenia z serwerem. Sprawdź internet i spróbuj ponownie.");
  } finally {
    setBusy(false);
  }
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  const t = msg.value;
  msg.value = "";
  ask(t);
});
document.querySelectorAll(".chip").forEach(function (c) {
  c.addEventListener("click", function () { ask(c.textContent); });
});
document.getElementById("reset").addEventListener("click", function () {
  if (busy) return;
  historia.length = 0;
  log.innerHTML = "";
  log.appendChild(empty);
  empty.hidden = false;
  msg.focus();
});
</script>
</body>
</html>
